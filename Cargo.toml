[package]
name = "mpte"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Un éditeur de texte simple, à onglets, pour macOS"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
rfd = "0.15.4"
serde = "1.0"
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
tempfile = "3.20"
regex = "1.12"
globset = "0.4"
walkdir = "2.5"
unicode-segmentation = "1.12"
unicode-width = "0.2"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
